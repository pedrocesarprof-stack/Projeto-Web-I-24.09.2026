<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeonato de Games</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>🎮 Campeonato Mini Games</h1>
        <h2>Inscrições Abertas</h2>
    </header>

    <main>
        <form action="#" method="POST" novalidate>

            <!-- Seção de Dados Pessoais -->
            <fieldset>
                <legend>Dados Pessoais</legend>

                <div>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome">
                </div>

                <div>
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade">
                </div>

                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email">
                </div>

                <div>
                    <label for="data_nascimento">Data de Nascimento:</label>
                    <input type="date" id="data_nascimento" name="data_nascimento">
                </div>
            </fieldset>

            <!-- Seção de Preferências -->
            <fieldset>
                <legend>Preferências do Campeonato</legend>

                <div>
                    <label>Dificuldade:</label><br>
                    <input type="radio" id="facil" name="dificuldade" value="Fácil">
                    <label for="facil">Fácil</label>

                    <input type="radio" id="medio" name="dificuldade" value="Médio">
                    <label for="medio">Médio</label>

                    <input type="radio" id="dificil" name="dificuldade" value="Difícil">
                    <label for="dificil">Difícil</label>
                </div>

                <div>
                    <label>Jogos de Interesse:</label><br>
                    <input type="checkbox" id="jogo1" name="jogos[]" value="FPS">
                    <label for="jogo1">Jogo da Velha</label>

                    <input type="checkbox" id="jogo2" name="jogos[]" value="MOBA">
                    <label for="jogo2">Sudoku</label>

                    <input type="checkbox" id="jogo3" name="jogos[]" value="Luta">
                    <label for="jogo3">Mario Bros</label>
                </div>

                <div>
                    <label for="personagem">Personagem:</label>
                    <select id="personagem" name="personagem">
                        <option value="">Selecione uma opção</option>
                        <option value="Teste">Teste 1</option>
                        <option value="Teste 2">Teste 2</option>
                        <option value="Teste 3">Teste 3</option>
                    </select>
                </div>

                <div>
                    <label for="mensagem">Mensagem para o campeonato:</label><br>
                    <textarea id="mensagem" name="mensagem" rows="4" cols="50"
                        placeholder="Escreva sua mensagem..."></textarea>
                </div>
            </fieldset>


            <br>
            <button onclick="cadastrar()" type="button">Cadastrar participante</button>

        </form>
        <p id="resultado"></p>
    </main>

    <script src="js/cadastro.js"></script>
</body>
</html>
